<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes wave{0%{stroke-dashoffset:0}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulse-ring{animation:pulse 6s infinite ease-in-out;transform-origin:center}.animated-stream{stroke-dasharray:10,15;animation:wave 4s linear infinite}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="300" fill="url(#grid)" rx="16"/><g opacity=".25"><circle cx="1050" cy="150" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="pulse-ring"/><circle cx="1050" cy="150" r="120" fill="none" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="1.5"/><circle cx="1050" cy="150" r="60" fill="none" stroke="#818cf8" stroke-width="2"/><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M 0,220 Q 300,160 600,240 T 1200,180" class="animated-stream"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 0,250 Q 300,210 600,270 T 1200,220" opacity=".5"/></g><rect width="8" height="160" x="60" y="70" fill="url(#accent-grad)" filter="url(#glow)" rx="4"/><g transform="translate(90, 0)"><rect width="280" height="32" x="0" y="65" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="16"/><text x="16" y="86" class="badge-text">🏭 AWESOME MANUFACTURING</text><text x="0" y="145" class="title" filter="url(#glow)">Awesome Manufacturing Intelligence</text><text x="0" y="185" class="subtitle">Curated Industrial IoT Platforms, OEE Analytics, Edge Data Operations &amp; Digital Twins</text></g></svg>