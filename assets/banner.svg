<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic animated background pulse lines */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .pulse-ring {
      animation: pulse 6s infinite ease-in-out;
      transform-origin: center;
    }
    .animated-stream {
      stroke-dasharray: 10, 15;
      animation: wave 4s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Background Animated Graphics (Low Opacity behind text) -->
  <g opacity="0.25">
    <circle cx="1050" cy="150" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="pulse-ring" />
    <circle cx="1050" cy="150" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 6" />
    <circle cx="1050" cy="150" r="60" fill="none" stroke="#818cf8" stroke-width="2" />
    
    <!-- Waveform Streams -->
    <path d="M 0,220 Q 300,160 600,240 T 1200,180" fill="none" stroke="url(#accent-grad)" stroke-width="3" class="animated-stream" />
    <path d="M 0,250 Q 300,210 600,270 T 1200,220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="70" width="8" height="160" rx="4" fill="url(#accent-grad)" filter="url(#glow)" />

  <!-- Foreground Text Content -->
  <g transform="translate(90, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="65" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="16" y="86" class="badge-text">🏭 AWESOME MANUFACTURING</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Manufacturing Intelligence</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated Industrial IoT Platforms, OEE Analytics, Edge Data Operations &amp; Digital Twins</text>
  </g>
</svg>
